<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=1f5d02b131e3cdce9aa8456cce15475c&autoload=false&libraries=services,clusterer,drawing"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main id="map" style="height: 100vh; width: 100%"></main>
  </body>
  <script>
    // 전역 변수 초기 세팅(window.var로 각 피쳐 js에서 접근가능)
    let map;
    window.isCompassMode = false;
    const DEFAULT_LAT = 37.5665;
    const DEFAULT_LON = 126.978;

    kakao.maps.load(() => {
      // 1. 맵 생성
      const mapContainer = document.getElementById('map');
      const mapOption = {
        center: new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LON),
        level: 2,
      };
      map = new kakao.maps.Map(mapContainer, mapOption);

      const waitForMyLocation = setInterval(() => {
        if (window.MyLocation) {
          clearInterval(waitForMyLocation);
          MyLocation.initMyLocationSetting(
            kakao,
            map,
            DEFAULT_LAT,
            DEFAULT_LON,
          );
        }
      }, 100);
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ type: 'mapReady', isReady: true }),
        );
      }
    });

    // RN 메시지 타입별 처리(중요)
    const handleMessage = event => {
      try {
        const data = JSON.parse(event.data);
        // 1. 내 위치 업데이트
        if (data.type === 'myLocation') {
          MyLocation.updateMyLocation(data.lat, data.lon, data.accuracy ?? 30);
        }

        // 2. 내 방향 업데이트
        if (data.type === 'myHeading') {
          MyLocation.rotateMyHeading(data.heading);
        }

        // 3. 내 위치로 이동
        if (data.type === 'myLocationFollowing') {
          map.setCenter(MyLocation.myLocationMarker.getPosition());
        }

        // 4. 내 위치 + 나침반 모드 on
        if (data.type === 'myLocationCompassOn') {
          window.isCompassMode = data.isCompassMode;
          MyLocation.setMyHeadingOverlayVisible(true);
          const marker = MyLocation.myLocationMarker;
          if (marker) {
            map.setCenter(marker.getPosition());
          }
        }

        // 5. 나침반 모드 off
        if (data.type === 'myLocationCompassOff') {
          window.isCompassMode = data.isCompassMode;
          MyLocation.setMyHeadingOverlayVisible(false);
        }
      } catch (error) {
        console.error('메시지 처리 실패:', error);
      }
    };

    document.addEventListener('message', handleMessage);
    window.addEventListener('message', handleMessage);
  </script>
  <script src="./src/features/map/utils/myLocation.js"></script>
</html>
