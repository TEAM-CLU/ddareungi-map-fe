language: "ko-KR"                # 리뷰 코멘트를 한국어로 작성
early_access: false              # 실험 기능 미사용

reviews:
  profile: "chill"               # 리뷰 스타일: chill / balanced / strict
  request_changes_workflow: true # 코드래빗이 리뷰 후 자동으로 승인/요청 처리
  high_level_summary: true       # 리뷰 마지막에 전체 요약 코멘트 작성
  poem: false                    # 재미용 시 자동 시 작성 여부
  review_status: true            # 리뷰 상태 메시지 표시
  collapse_walkthrough: false    # 리뷰 코멘트 접기 여부

  auto_review:
    enabled: true                # 자동 리뷰 켜기
    drafts: false                # draft PR도 자동 리뷰할지 여부
    base_branches:              # 자동 리뷰가 동작할 브랜치 목록
      - main
      - dev
      - feat/*

chat:
  auto_reply: true               # PR 코멘트에 자동 응답
