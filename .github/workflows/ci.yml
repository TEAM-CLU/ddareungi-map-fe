name: CI (PR quick check)

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. pnpm 먼저 설치
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 2. Node + pnpm 캐시 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 3. 의존성 설치
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. 타입체크만 수행 (출력물 없음, 빠르게 검증)
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # 5. 번들 테스트 (iOS)
      - name: Bundle iOS
        run: |
          pnpm exec react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/main.ios.jsbundle \
            --assets-dest /tmp/ios-assets

      # 6. 번들 테스트 (Android)
      - name: Bundle Android
        run: |
          pnpm exec react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/main.android.jsbundle \
            --assets-dest /tmp/android-assets
