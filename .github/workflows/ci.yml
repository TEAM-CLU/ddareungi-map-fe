name: CI (PR-only RN build)

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  android:
    name: Android assembleDebug
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build Android (assembleDebug)
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

  ios:
    name: iOS build (Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (iphonesimulator)
        run: |
          xcodebuild \
            -workspace ios/DdareungiMap.xcworkspace \
            -scheme DdareungiMap \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build
