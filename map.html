<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6e6b6e4db6a53b64920ebb18c2623c4a&autoload=false&libraries=services,clusterer,drawing"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main id="map" style="height: 100vh; width: 100%"></main>
    <script>
      // 초기 세팅
      let map;
      let myLocationMarker;
      const DEFAULT_LAT = 37.5665;
      const DEFAULT_LON = 126.978;

      // 맵이 로드가 되기 전에...
      kakao.maps.load(() => {
        // 1. 맵 생성
        const mapContainer = document.getElementById('map');
        const mapOption = {
          center: new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LON),
          level: 2,
        };
        map = new kakao.maps.Map(mapContainer, mapOption);

        // 2. 내 위치 마커 생성
        const myLocationSvg = `
            <div style="
              position: absolute;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%);
              display: flex;
              align-items: center;
              justify-content: center;
              width: 23px;
              height: 23px;
            ">
              <svg xmlns='http://www.w3.org/2000/svg' width='23' height='23' viewBox='0 0 23 23' fill='none'>
                <circle cx='11.7393' cy='11.739' r='9.5' fill='#01DA86' stroke='white' stroke-width='3'/>
              </svg>
            </div>
          `;

        myLocationMarker = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LON),
          content: myLocationSvg,
          xAnchor: 0.5,
          yAnchor: 0.5,
        });
        myLocationMarker.setMap(map);

        // 맵 준비 완료시 RN에 알림
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(
            JSON.stringify({ type: 'mapReady', isReady: true }),
          );
        }
      });

      // RN 메시지 타입별 처리
      const handleMessage = event => {
        const data = JSON.parse(event.data);
        // 1. 내 위치 업데이트
        if (data.type === 'myLocation') {
          updateMyLocation(data.lat, data.lon);
        }
      };

      // 1. 내 위치 업데이트
      const updateMyLocation = (lat, lon) => {
        const updatedPosition = new kakao.maps.LatLng(lat, lon);
        myLocationMarker.setPosition(updatedPosition);
        map.setCenter(updatedPosition);
      };

      document.addEventListener('message', handleMessage);
      window.addEventListener('message', handleMessage);
    </script>
  </body>
</html>
