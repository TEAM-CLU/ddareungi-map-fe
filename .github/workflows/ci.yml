name: CI (PR quick check)

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  js-quick:
    name: Install + Typecheck + Bundle (no native build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Bundle iOS (dry run)
        run: |
          node node_modules/react-native/cli.js bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/main.ios.jsbundle \
            --assets-dest /tmp/ios-assets

      - name: Bundle Android (dry run)
        run: |
          node node_modules/react-native/cli.js bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/main.android.jsbundle \
            --assets-dest /tmp/android-assets
