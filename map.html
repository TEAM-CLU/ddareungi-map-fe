<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6e6b6e4db6a53b64920ebb18c2623c4a&autoload=false&libraries=services,clusterer,drawing"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main id="map" style="height: 100vh; width: 100%"></main>
    <script>
      let map = null;
      let myMarker = null;

      // 기본 위치 (서울시청)
      const DEFAULT_LAT = 37.5665;
      const DEFAULT_LNG = 126.978;
      kakao.maps.load(() => {
        map = new kakao.maps.Map(document.getElementById('map'), {
          center: new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LNG),
          level: 3,
        });

        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(
            JSON.stringify({ type: 'mapReady', isReady: true }),
          );
          console.log('📤 mapReady 메시지 전송');
        }
      });

      // RN 메시지 type별 처리
      window.addEventListener('message', event => {
        try {
          const data = JSON.parse(event.data);
          console.log('📨 메시지 수신:', data);

          if (data.type === 'myLocation') {
            updateMyLocation(data.lat, data.lon);
          }
        } catch (error) {
          console.error('❌ 메시지 파싱 에러:', error);
        }
      });

      // 내 위치 마커 업데이트
      function updateMyLocation(lat, lon) {
        if (!map) {
          console.error('❌ 지도가 초기화되지 않음');
          return;
        }

        console.log('📍 위치 업데이트:', lat, lon);

        const position = new kakao.maps.LatLng(lat, lon);

        // 마커가 없으면 생성
        if (!myMarker) {
          myMarker = new kakao.maps.Marker({
            position: position,
            map: map,
          });

          // 첫 위치로 지도 중심 이동
          map.setCenter(position);
          console.log('✅ 마커 생성 & 지도 중심 이동');
        } else {
          // 마커가 있으면 위치만 업데이트
          myMarker.setPosition(position);
          console.log('🔄 마커 위치 업데이트');
        }
      }
    </script>
  </body>
</html>
