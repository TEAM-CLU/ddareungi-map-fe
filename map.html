<!DOCTYPE html>
<html>
  <head>
    <meta name="referrer" content="origin" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=68ef2791dbc8e895c56402c868837fc3&autoload=false&libraries=services,clusterer,drawing"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main id="map" style="height: 100vh; width: 100%"></main>
  </body>
  <script>
    // 전역 변수 초기 세팅(window.var로 각 피쳐 js에서 접근가능)
    let map;
    window.isCompassMode = false;
    const DEFAULT_LAT = 37.5665;
    const DEFAULT_LON = 126.978;

    kakao.maps.load(() => {
      // 맵 생성
      const mapContainer = document.getElementById('map');
      const mapOption = {
        center: new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LON),
        level: 2,
      };
      map = new kakao.maps.Map(mapContainer, mapOption);

      const waitForOtherScripts = setInterval(() => {
        if (
          window.MyLocation &&
          window.Route &&
          window.Search &&
          window.Station &&
          window.kakao &&
          window.kakao.maps
        ) {
          clearInterval(waitForOtherScripts);
          MyLocation.initMyLocationSetting(
            kakao,
            map,
            DEFAULT_LAT,
            DEFAULT_LON,
          );
          Route.initRouteSetting(kakao, map, DEFAULT_LAT, DEFAULT_LON);
          Search.initSearchSetting(kakao, map);
          Station.initStationSeting(kakao, map);
          // 실시간 맵 센터 좌표 RN에 최조 전송(대여소 조회용)
          (function sendInitialCenter() {
            const centerCoord = map.getCenter();
            window.ReactNativeWebView?.postMessage(
              JSON.stringify({
                type: 'changeMapCenter',
                lat: centerCoord.getLat(),
                lon: centerCoord.getLng(),
              }),
            );
          })();

          // 2) 이후엔 idle 때마다 전송
          kakao.maps.event.addListener(map, 'idle', () => {
            const centerCoord = map.getCenter();
            window.ReactNativeWebView?.postMessage(
              JSON.stringify({
                type: 'changeMapCenter',
                lat: centerCoord.getLat(),
                lon: centerCoord.getLng(),
              }),
            );
          });

          // const mockRoute = {
          //   mode: 'full',
          //   start: { lat: 37.63149, lon: 127.07733 }, // 서울과학기술대학교
          //   waypoints: [
          //     { lat: 37.6364, lon: 127.0675 }, // 하계역
          //     { lat: 37.6232, lon: 127.0605 }, // 월계역
          //   ],
          //   end: { lat: 37.6177, lon: 127.0758 }, // 태릉입구역
          //   path: [
          //     // start → waypoint1
          //     { lat: 37.63149, lon: 127.07733 },
          //     { lat: 37.6343, lon: 127.0729 },
          //     { lat: 37.6364, lon: 127.0675 }, // 하계역

          //     // waypoint1 → waypoint2
          //     { lat: 37.6328, lon: 127.0652 },
          //     { lat: 37.6285, lon: 127.0621 },
          //     { lat: 37.6232, lon: 127.0605 }, // 월계역

          //     // waypoint2 → end
          //     { lat: 37.621, lon: 127.0668 },
          //     { lat: 37.619, lon: 127.0714 },
          //     { lat: 37.6177, lon: 127.0758 }, // 태릉입구역
          //   ],
          // };
          // Route.drawStaticRoute(mockRoute);
        }
      }, 100);

      // RN에 맵 로딩 완료 알림(중요)
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ type: 'mapReady', isReady: true }),
        );
      }
    });

    // RN 메시지 타입별 처리(중요)
    const handleMessage = event => {
      try {
        const data = JSON.parse(event.data);

        // 1. 내 위치 업데이트
        if (data.type === 'myLocation') {
          MyLocation.updateMyLocation(data.lat, data.lon, data.accuracy ?? 30);
        }

        // 2. 내 방향 업데이트
        if (data.type === 'myHeading') {
          MyLocation.rotateMyHeading(data.heading);
        }

        // 3. 내 위치로 이동
        if (data.type === 'myLocationFollowing') {
          map.setCenter(MyLocation.myLocationMarker.getPosition());
        }

        // 4. 내 위치 + 나침반 모드 on
        if (data.type === 'myLocationCompassOn') {
          window.isCompassMode = data.isCompassMode;
          MyLocation.setMyHeadingOverlayVisible(true);
          const marker = MyLocation.myLocationMarker;
          if (marker) {
            map.setCenter(marker.getPosition());
          }
        }

        // 5. 나침반 모드 off
        if (data.type === 'myLocationCompassOff') {
          window.isCompassMode = data.isCompassMode;
          MyLocation.setMyHeadingOverlayVisible(false);
        }

        // === 새로운 검색 관련 메시지 처리 ===

        // 6. 장소 마커 표시
        if (data.type === 'showPlaceMarker') {
          Search.showPlaceMarker(
            data.lat,
            data.lng,
            data.placeName,
            data.placeInfo,
          );
        }

        // 7. 특정 위치로 이동
        if (data.type === 'moveToLocation') {
          Search.moveToLocation(data.lat, data.lng, data.placeName);
        }

        // 8. 검색 결과 여러 마커 표시
        if (data.type === 'showSearchResults') {
          Search.showSearchResults(data.places);
        }

        // 9. 현재 장소 마커 제거
        if (data.type === 'clearCurrentPlaceMarker') {
          Search.clearCurrentPlaceMarker();
        }

        // 10. 검색 마커들 제거
        if (data.type === 'clearSearchMarkers') {
          Search.clearSearchMarkers();
        }

        // 11. 모든 검색 요소 제거
        if (data.type === 'clearAllSearchElements') {
          Search.clearAll();
        }

        // === 새로운 라우팅 관련 메시지 처리 ===

        // 12. 경로 업데이트
        if (data.type === 'updateRoute') {
          Route.updateRoute(data.routeType, data.points);
        }

        // 13. 경로 클리어
        if (data.type === 'clearRoute') {
          Route.clearRoute();
        }

        // 14. 경로 타입 변경
        if (data.type === 'setRouteType') {
          Route.setRouteType(data.routeType);
        }

        // 15. 특정 경로 포인트로 이동
        if (data.type === 'moveToRoutePoint') {
          Route.moveToRoutePoint(data.pointId);
        }

        // === 대여소 기능 ===

        // 16. 대여소 마커 표시
        if (data.type === 'updateStationDataList') {
          Station.createStationMarkers(data.stations);
        }
        // 17. 대여소 재고정보 업데이트
        if (data.type === 'updateTargetedStationBikeCountList') {
          Station.updateStationBikeCountList(data.stationBikeCountList);
        }

        // 18. 대여소 마커 표시 on/off
        if (data.type === 'toggleStationMarkers') {
          Station.toggleStationMarkers(data.isVisible);
        }

        // 19. Nearby 클릭 대여소 포커싱
        if (data.type === 'focusOnTargetedNearbyStation') {
          Station.focusOnTargetedNearbyStation(data.targetedStationData);
        }
      } catch (error) {
        console.error('메시지 처리 실패:', error);
      }
    };

    document.addEventListener('message', handleMessage);
    window.addEventListener('message', handleMessage);
  </script>
  <script src="./src/features/location/utils/myLocation.js" defer></script>
  <script src="./src/features/routing/utils/routing.js" defer></script>
  <script src="./src/features/search/utils/search.js" defer></script>
  <script src="./src/features/station/utils/station.js" defer></script>
</html>
